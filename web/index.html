<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<title>mySurveillance</title>
<style>
:root{--bg:#0c0e12;--panel:#13161b;--raise:#1c2027;--line:#252a33;--text:#e7e9ee;--dim:#8a92a0;--accent:#4f8cff;--ok:#3ecf8e;--bad:#f0494f;--warn:#f0b03a;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
button:hover:not(:disabled){background:#252a33}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:4px;width:36px;height:36px;padding:0;background:transparent;border-color:transparent;color:var(--dim)}
.ib:hover:not(:disabled){background:var(--raise);color:var(--text)}
.ib.on{background:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
button.primary,button.primary:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.on,button.on:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#fff}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
input[type=checkbox]{width:auto}
label{display:block;color:var(--dim);font-size:13px;margin:8px 0 3px}
h3{margin:0 0 8px;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.row>button,.row>.fit{flex:0 0 auto;min-width:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--dim)}
.recording .dot{background:var(--ok)}.retrying .dot{background:var(--bad)}.starting .dot{background:var(--warn)}
.dim{color:var(--dim);font-size:13px}
.err{color:var(--bad);font-size:13px;word-break:break-all}
.hide{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
#login{max-width:340px;margin:18vh auto;padding:0 16px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:8px;max-width:90vw;z-index:50}

/* main screen: header, video wall, timeline */
#app{height:100dvh;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;height:48px;padding:0 10px 0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;letter-spacing:.2px;color:var(--dim);white-space:nowrap}
.brand b{color:var(--text);font-weight:650}
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.chip b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.chip .dot{margin:0;width:7px;height:7px}
.chip.ok .dot{background:var(--ok);box-shadow:0 0 0 3px #3ecf8e22}.chip.bad .dot{background:var(--bad)}.chip.warn .dot{background:var(--warn)}
.meter{display:inline-block;width:54px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
#top .sp{flex:1}
#layoutBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#layoutBar .num{display:inline-flex;align-items:center;gap:6px}
#layoutBar .num button{padding:4px 11px}
#grid{flex:1;min-height:0;display:grid;gap:2px;background:#000}
.cell{position:relative;background:#05070a;overflow:hidden;min-width:0;min-height:0}
.cell.big{grid-column:span 2;grid-row:span 2}
.cell video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;transform-origin:0 0}
.cell.zoomed{cursor:grab}.cell.zoomed:active{cursor:grabbing}
#grid.cover .cell video{object-fit:cover}
#grid.solo .cell{display:none}
#grid.solo .cell.solo{display:block;grid-column:1/-1;grid-row:1/-1}
.cell .tag{position:absolute;left:6px;top:6px;background:#000a;border-radius:6px;padding:2px 8px;font-size:13px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.cell .tools{position:absolute;right:6px;top:6px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.cell:hover .tools,.cell .tools:focus-within,#grid.edit .cell .tools{opacity:1}
.cell .tools button,.cell .tools a{background:#000a;color:var(--text);border-radius:6px;padding:2px 8px;font-size:13px;text-decoration:none}
.cell .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 12px;color:var(--dim);font-size:13px;pointer-events:none;word-break:break-all}
.cell .edit{position:absolute;left:8px;right:8px;bottom:8px;display:none;gap:6px}
#grid.edit .cell .edit{display:flex}
.cell .edit select{background:#000c}
.cell .edit button{flex:0 0 auto}
#grid.edit .cell{outline:1px dashed var(--line);outline-offset:-1px}

#bar{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#tl{position:relative;height:44px;background:var(--bg);border:1px solid var(--line);border-radius:10px;cursor:pointer;overflow:hidden;touch-action:none;user-select:none}
#tl .rng{position:absolute;top:6px;height:8px;background:var(--accent);opacity:.8;min-width:1px;border-radius:2px}
#tl .future{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,#0000 0 6px,#ffffff0d 6px 12px)}
#tl .tick{position:absolute;bottom:0;font-size:11px;color:var(--dim);border-left:1px solid var(--line);padding-left:4px;height:24px;line-height:28px;white-space:nowrap;pointer-events:none}
#tl .tick.day{color:var(--text);border-left-color:var(--dim);height:100%;display:flex;align-items:flex-end;line-height:20px}
#tl .cur{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;box-shadow:0 0 0 1px #0008}
#tl .cur::before{content:"";position:absolute;left:-4px;top:-1px;width:10px;height:10px;border-radius:50%;background:#fff}
#ctl{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"left mid right";align-items:center;gap:8px 12px;margin-top:8px}
#ctl .grp{display:flex;align-items:center;gap:6px;min-width:0}
#ctl .left{grid-area:left;gap:12px}#ctl .mid{grid-area:mid;gap:4px}#ctl .right{grid-area:right;justify-content:flex-end}
#clock{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap}
#cDate{font-size:11.5px;color:var(--dim);letter-spacing:.3px}
#cTime{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:.5px;font-variant-numeric:tabular-nums}
#liveBtn{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--dim);font-size:11.5px;font-weight:700;letter-spacing:1.2px}
#liveBtn i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor}
#liveBtn:hover{color:var(--text);border-color:var(--dim);background:transparent}
#liveBtn.on,#liveBtn.on:hover{background:var(--bad);border-color:var(--bad);color:#fff;cursor:default}
#liveBtn.on i{background:#fff;border-color:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#liveBtn.on i{animation:none}}
#ctl .mid .ib{width:40px;height:40px;border-radius:50%}
#ctl .mid .ib.txt{width:auto;padding:0 10px;border-radius:999px;font-size:12px}
#bPlay{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;margin:0 6px;padding:0;border-radius:50%;background:var(--text);border-color:var(--text);color:#0c0e12}
#bPlay:hover:not(:disabled){background:#fff;border-color:#fff}
#rate{appearance:none;-webkit-appearance:none;width:auto;height:32px;padding:0 12px;border-radius:999px;background:var(--raise);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:center;cursor:pointer}
#rate:disabled{opacity:.4;cursor:default}
.pick{position:relative;display:inline-flex}
#cal{position:absolute;right:0;bottom:calc(100% + 12px);width:292px;padding:14px 14px 12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 48px #000b;z-index:20}
#cal .head{display:flex;align-items:center;margin-bottom:6px}
#cal .head b{flex:1;text-align:center;font-size:14px;font-weight:600;letter-spacing:.2px}
#cal .head .ib{width:30px;height:30px;border-radius:50%}
#cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
#cal .wd{padding:6px 0 4px;font-size:11px;color:var(--dim);text-align:center}
#cal .wd:first-child{color:#d98a8e}
#cal .d{position:relative;height:36px;padding:0;border:0;border-radius:50%;background:transparent;font-size:13px;font-variant-numeric:tabular-nums;justify-self:center;width:36px}
#cal .d:hover:not(:disabled){background:var(--raise)}
#cal .d:disabled{color:#454b57;opacity:1}
#cal .d.has::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
#cal .d.today{box-shadow:inset 0 0 0 1px var(--dim)}
#cal .d.sel,#cal .d.sel:hover{background:var(--accent);color:#fff;box-shadow:none}
#cal .d.sel::after{background:#fff}
#cal .time{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 12px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim)}
#cal .time input{width:52px;height:38px;padding:0;text-align:center;font:600 17px var(--mono);border-radius:10px;background:var(--bg)}
#cal .time small{font-size:11.5px;margin-right:6px}
#cal .foot{display:flex;gap:8px}
#cal .foot button{height:34px;flex:1;font-size:13px}
#cal .legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--dim)}
#cal .legend i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.seg{display:inline-flex;align-items:center;height:32px;background:var(--raise);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{width:30px;height:100%;padding:0;border:0;border-radius:0;background:transparent;color:var(--dim);font-size:15px}
.seg button:hover:not(:disabled){background:#252a33;color:var(--text)}
.seg span{min-width:58px;padding:0 2px;font-size:12px;color:var(--text);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
#tlWrap{position:relative}
#tlTip{position:absolute;bottom:calc(100% + 6px);transform:translateX(-50%);background:#000e;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:12px var(--mono);white-space:nowrap;pointer-events:none}
@media (max-width:760px){#ctl{grid-template-columns:1fr auto;grid-template-areas:"left right" "mid mid"}#ctl .mid{justify-content:center}#cTime{font-size:18px}}

/* settings window */
dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0;width:min(760px,96vw);max-height:92dvh;overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#000a}
#setBody{padding:14px;overflow:auto;flex:1;min-height:0}
#setHead,#setFoot{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel)}
#setHead{border-bottom:1px solid var(--line)}#setFoot{border-top:1px solid var(--line);justify-content:flex-end}
#setHead b{flex:1;font-size:16px}
.cam{border-top:1px solid var(--line)}
.cam .sum{display:flex;align-items:center;gap:8px;padding:10px 4px;cursor:pointer}
.cam .sum .name{flex:1;min-width:0}
.cam .sum .right{text-align:right}
.cam .form{padding:0 4px 12px}
.badge{font-size:12px;border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:0 6px;margin-left:6px}
.found{padding:10px 4px;border-top:1px solid var(--line)}
@media (max-width:640px){#chipStore .meter{display:none}.brand span{display:none}}
</style>
</head>
<body>
<div id="login" class="hide">
  <div class="card">
    <h3>mySurveillance</h3>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="loginErr"></p>
    <button class="primary" id="loginBtn" style="width:100%">로그인</button>
  </div>
</div>

<div id="app" class="hide">
  <div id="top">
    <div class="brand"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3.6" fill="#f0494f"/></svg><span>my<b>Surveillance</b></span></div>
    <span class="chip" id="chipRec"><i class="dot"></i><span></span></span>
    <span class="chip" id="chipStore"><span></span><i class="meter"><i></i></i></span>
    <span class="sp"></span>
    <button class="ib" id="layoutBtn" title="화면 배치" aria-label="화면 배치"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
    <button class="ib" id="setBtn" title="설정" aria-label="설정"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </div>
  <div id="layoutBar" class="hide">
    <span class="num">가로 <button id="colsDn">−</button><b id="colsN"></b><button id="colsUp">+</button></span>
    <span class="num">세로 <button id="rowsDn">−</button><b id="rowsN"></b><button id="rowsUp">+</button></span>
    <button id="fitBtn"></button>
    <button id="autoBtn">자동 배치</button>
    <span class="dim" style="flex:1">칸마다 보여줄 카메라를 고르세요. "크게"는 그 칸을 2×2로 키웁니다.</span>
    <button class="primary" id="layoutDone">완료</button>
  </div>
  <div id="grid"></div>
  <div id="bar">
    <div id="tlWrap"><div id="tl"></div><div id="tlTip" class="hide"></div></div>
    <div id="ctl">
      <div class="grp left">
        <div id="clock"><span id="cDate"></span><span id="cTime"></span></div>
        <button id="liveBtn" title="실시간으로 돌아가기"><i></i>LIVE</button>
      </div>
      <div class="grp mid">
        <button class="ib txt" id="bM60" title="1분 전"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/></svg>1분</button>
        <button class="ib" id="bM10" title="10초 전 (←)" aria-label="10초 전"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5a7.5 7.5 0 1 1-6.9 4.6"/><path d="M4.6 4.6v5h5"/><text x="12" y="15.6" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></svg></button>
        <button id="bPlay" title="재생/일시정지 (스페이스)" aria-label="재생/일시정지"></button>
        <button class="ib" id="bP10" title="10초 뒤 (→)" aria-label="10초 뒤"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5a7.5 7.5 0 1 0 6.9 4.6"/><path d="M19.4 4.6v5h-5"/><text x="12" y="15.6" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></svg></button>
        <button class="ib txt" id="bP60" title="1분 뒤">1분<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 6l6 6-6 6M5 6l6 6-6 6"/></svg></button>
      </div>
      <div class="grp right">
        <select id="rate" aria-label="재생 속도" title="재생 속도"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
        <span class="pick"><button class="ib" id="whenBtn" title="날짜·시각을 골라 이동" aria-label="날짜·시각을 골라 이동" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg></button>
          <div id="cal" class="hide" role="dialog" aria-label="날짜와 시각 선택">
            <div class="head"><button class="ib" id="calPrev" aria-label="이전 달"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button><b id="calTitle"></b><button class="ib" id="calNext" aria-label="다음 달"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button></div>
            <div class="days" id="calDays"></div>
            <div class="time"><small>시각</small><input id="calH" inputmode="numeric" maxlength="2" aria-label="시">:<input id="calM" inputmode="numeric" maxlength="2" aria-label="분">:<input id="calS" inputmode="numeric" maxlength="2" aria-label="초"></div>
            <div class="foot"><button id="calNow">지금 (LIVE)</button><button class="primary" id="calGo">이 시각으로 이동</button></div>
            <div class="legend"><i></i>녹화가 있는 날</div>
          </div>
        </span>
        <span class="seg" title="타임라인 범위 (타임라인 위에서 휠로도 조절)"><button id="zOut" aria-label="타임라인 넓게">−</button><span id="zLabel"></span><button id="zIn" aria-label="타임라인 좁게">+</button></span>
      </div>
    </div>
  </div>
</div>

<dialog id="setDlg">
  <div id="setHead"><b>설정</b><button id="setClose">닫기</button></div>
  <div id="setBody">
    <div class="card">
      <h3>저장</h3>
      <label for="sDir">저장 폴더</label><input id="sDir">
      <div class="row">
        <div><label for="sDays">최대 저장 기간 (일)</label><input id="sDays" type="number" min="0" step="1"></div>
        <div><label for="sMax">최대 저장 용량 (GB)</label><input id="sMax" type="number" min="0" step="1"></div>
      </div>
      <p class="dim" id="sLimitHint"></p>
    </div>
    <div class="card">
      <div class="row">
        <h3 style="margin:0">카메라</h3>
        <button id="scanBtn">자동 검색</button>
        <button id="addCam">+ 직접 추가</button>
      </div>
      <div id="scanBox" class="hide" style="margin-top:10px">
        <div class="dim" id="scanNets"></div>
        <div id="scanList"></div>
      </div>
      <div id="camList" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h3>비밀번호 변경</h3>
      <div class="row">
        <input id="pwCur" type="password" placeholder="현재 비밀번호" autocomplete="current-password">
        <input id="pwNew" type="password" placeholder="새 비밀번호 (4자 이상)" autocomplete="new-password">
        <button id="pwBtn">변경</button>
      </div>
      <button id="logoutBtn" style="margin-top:10px">로그아웃</button>
    </div>
  </div>
  <div id="setFoot"><span class="dim" style="flex:1">"저장"을 눌러야 녹화에 반영됩니다.</span><button class="primary" id="saveBtn">저장</button></div>

$('bM60').onclick = jump(-60000); $('bM10').onclick = jump(-10000); $('bP10').onclick = jump(10000); $('bP60').onclick = jump(60000);
$('bPlay').onclick = () => {
  if (mode === 'live') { seek(Date.now() - LIVE_EDGE - 5000); playing = false; } else playing = !playing;
};
$('liveBtn').onclick = goLive;
// Date-time popover: pick a day and a time, then jump there.
const cal = {y: 0, m: 0, sel: 0};
const calOpen = () => !$('cal').classList.contains('hide');
function closeCal() { $('cal').classList.add('hide'); $('whenBtn').classList.remove('on'); }
function openCal() {
  const d = new Date(T);
  cal.y = d.getFullYear(); cal.m = d.getMonth(); cal.sel = dayStart(T);
  $('calH').value = pad(d.getHours()); $('calM').value = pad(d.getMinutes()); $('calS').value = pad(d.getSeconds());
  drawCal(); $('cal').classList.remove('hide'); $('whenBtn').classList.add('on');
}
function drawCal() {
  $('calTitle').textContent = cal.y + '년 ' + (cal.m + 1) + '월';
  const today = dayStart(Date.now()), now = new Date();
  const oldest = status && status.storage.oldest ? dayStart(Date.parse(status.storage.oldest)) : Infinity;
  const kids = [...'일월화수목금토'].map(w => el('div', {className: 'wd', textContent: w}));
  for (let i = new Date(cal.y, cal.m, 1).getDay(); i > 0; i--) kids.push(el('span'));
  for (let day = 1, n = new Date(cal.y, cal.m + 1, 0).getDate(); day <= n; day++) {
    const t = new Date(cal.y, cal.m, day).getTime();
    const b = el('button', {textContent: day, disabled: t > today,
      className: 'd' + (t === today ? ' today' : '') + (t === cal.sel ? ' sel' : '') + (t >= oldest && t <= today ? ' has' : '')});
    b.onclick = () => { cal.sel = t; drawCal(); };
    b.ondblclick = goCal;
    kids.push(b);
  }
  $('calDays').replaceChildren(...kids);
  $('calNext').disabled = cal.y > now.getFullYear() || (cal.y === now.getFullYear() && cal.m >= now.getMonth());
}
function goCal() {
  const num = (id, max) => Math.min(max, Math.max(0, parseInt($(id).value) || 0)), d = new Date(cal.sel);
  seek(new Date(d.getFullYear(), d.getMonth(), d.getDate(), num('calH', 23), num('calM', 59), num('calS', 59)).getTime());
  closeCal();
}
const calMonth = step => () => { const d = new Date(cal.y, cal.m + step, 1); cal.y = d.getFullYear(); cal.m = d.getMonth(); drawCal(); };
$('whenBtn').onclick = () => calOpen() ? closeCal() : openCal();
$('calPrev').onclick = calMonth(-1); $('calNext').onclick = calMonth(1);
$('calGo').onclick = goCal;
$('calNow').onclick = () => { goLive(); closeCal(); };
for (const [id, max] of [['calH', 23], ['calM', 59], ['calS', 59]]) {
  const inp = $(id);
  inp.onfocus = () => inp.select();
  inp.onblur = () => { inp.value = pad(Math.min(max, Math.max(0, parseInt(inp.value) || 0))); };
  inp.onkeydown = e => {
    if (e.key === 'Enter') goCal();
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      inp.value = pad(((parseInt(inp.value) || 0) + (e.key === 'ArrowUp' ? 1 : max) ) % (max + 1));
    }
  };
}
addEventListener('pointerdown', e => { if (calOpen() && !e.target.closest('.pick')) closeCal(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && calOpen()) closeCal(); });
$('tl').addEventListener('pointermove', e => {
  const r = $('tl').getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), d = new Date(tlStart + f * tlSpan), tip = $('tlTip');
  tip.textContent = (tlSpan > DAY ? (d.getMonth() + 1) + '/' + d.getDate() + ' ' : '') + hhmm(d) + ':' + pad(d.getSeconds());
  tip.style.left = Math.min(r.width - 40, Math.max(40, f * r.width)) + 'px'; tip.classList.remove('hide');
});
$('tl').addEventListener('pointerleave', () => $('tlTip').classList.add('hide'));
addEventListener('keydown', e => {
  if ($('setDlg').open || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || $('app').classList.contains('hide')) return;
  if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); }
  else if (e.key === 'ArrowLeft') seek(T - 10000);
  else if (e.key === 'ArrowRight') seek(T + 10000);
});

/* ---------- settings window ---------- */
let cams = [], devices = null, limitBy = 'days', usage = null;
const openCams = new Set(), newCams = new Set(); // camera objects being edited / not saved yet
const TYPES = {usb: 'USB 카메라 (이 컴퓨터에 연결)', rtsp: 'IP 카메라 / 폰 앱 (RTSP 주소)', http: '폰 앱 / 웹캠 (HTTP·MJPEG 주소)'};
const CAMTYPE = {usb: 'USB', rtsp: 'IP 카메라', http: 'HTTP'};
const round1 = v => Math.floor(v * 10) / 10;
// Recordings can never take more than what they use now plus the free space,
// minus the space the disk must always keep.
const room = () => usage ? Math.max(0, usage.usedBytes + usage.diskFreeBytes - usage.reserveBytes) : Infinity;
function syncLimit(clamp) {
  const perDay = usage ? usage.bytesPerDay : 0, max = room();
  let days = parseFloat($('sDays').value) || 0, size = parseFloat($('sMax').value) || 0, capped = false;
  if (clamp && limitBy === 'size' && size * G > max) { size = round1(max / G); $('sMax').value = size; capped = true; }
  if (clamp && limitBy === 'days' && perDay && days * perDay > max) { days = round1(max / perDay); $('sDays').value = days; capped = true; }
  const other = $(limitBy === 'days' ? 'sMax' : 'sDays');
  other.placeholder = perDay ? '' : '측정 후 계산';
  if (!perDay) other.value = '';
  else if (limitBy === 'days') other.value = round1(days * perDay / G);
  else other.value = round1(size * G / perDay);
  let t = perDay
    ? '현재 카메라 ' + usage.camerasMeasured + '대 기준 하루 약 ' + gb(perDay) + ' 사용' + (usage.camerasEnabled > usage.camerasMeasured ? ' (' + (usage.camerasEnabled - usage.camerasMeasured) + '대는 측정 중)' : '') + '. '
    : '녹화가 1분 이상 쌓이면 카메라별 사용량을 측정해 나머지 값을 계산합니다. ';
  if (usage) t += '이 디스크에 담을 수 있는 최대: ' + gb(max) + (perDay ? ' (약 ' + round1(max / perDay) + '일)' : '') + ' — 항상 비워 두는 ' + gb(usage.reserveBytes) + ' 제외. ';
  if (capped) t += '입력한 값이 최대를 넘어 최대값으로 맞췄습니다. ';
  $('sLimitHint').textContent = t + (limitBy === 'days' ? '기준: 기간' : '기준: 용량');
}
$('sDays').oninput = () => { limitBy = 'days'; syncLimit(false); };
$('sMax').oninput = () => { limitBy = 'size'; syncLimit(false); };
$('sDays').onchange = $('sMax').onchange = () => syncLimit(true);
async function openSettings() {
  try {
    const c = await api('config');
    usage = (await api('status')).storage;
    limitBy = c.limitBy === 'size' ? 'size' : 'days';
    $('sDir').value = c.storageDir; $('sDays').value = c.maxDays; $('sMax').value = c.maxStorageGB;
    syncLimit(true);
    cams = c.cameras || []; openCams.clear(); newCams.clear(); scanResult = null; $('scanBox').classList.add('hide');
    renderCams();
    $('setDlg').showModal();
    if (!devices) api('devices').then(d => { devices = d; renderCams(); }).catch(() => {});
  } catch (e) { toast(e.message); }
}
$('setBtn').onclick = openSettings;
$('setClose').onclick = () => $('setDlg').close();
function field(label, input) { return el('div', {}, el('label', {textContent: label}), input); }
function bind(input, cam, key, kind) {
  if (kind === 'check') { input.checked = !!cam[key]; input.onchange = () => cam[key] = input.checked; }
  else { input.value = cam[key] ?? ''; input.oninput = input.onchange = () => cam[key] = kind === 'num' ? (parseInt(input.value) || 0) : input.value; }
  return input;
}
function deviceSelect(cam, key, list, emptyLabel) {
  const names = [...new Set([...(list || []), cam[key]].filter(Boolean))];
  const s = el('select', {}, el('option', {value: '', textContent: emptyLabel}), ...names.map(n => el('option', {value: n, textContent: n})));
  return bind(s, cam, key);
}
function sourceOf(cam) {
  if (cam.type === 'usb') return cam.videoDevice || '';
  try { return new URL(cam.url).host; } catch { return ''; }
}
// One line per camera: what it is and how it is doing; opening it shows its settings.
const camRows = new Map(); // camera id -> the parts that show live status
function renderCams() {
  camRows.clear();
  const list = $('camList');
  list.replaceChildren(...cams.map((cam, i) => {
    const open = openCams.has(cam), fresh = newCams.has(cam);
    const dotWrap = el('span', {}, el('span', {className: 'dot'}));
    const title = el('b', {textContent: cam.name || '(이름 없음)'});
    const sub = el('div', {className: 'dim', textContent: (CAMTYPE[cam.type] || cam.type) + ' · ' + (sourceOf(cam) || '주소 없음')});
    const state = el('div'), use = el('div'), err = el('div', {className: 'err'});
    const sum = el('div', {className: 'sum'}, dotWrap,
      el('div', {className: 'name'}, title, fresh ? el('span', {className: 'badge', textContent: '저장 전'}) : '', sub, err),
      el('div', {className: 'dim right'}, state, use),
      el('button', {textContent: open ? '접기' : '편집'}));
    sum.onclick = () => { open ? openCams.delete(cam) : openCams.add(cam); renderCams(); };
    if (cam.id && !fresh) camRows.set(cam.id, {dotWrap, state, use, err});
    const box = el('div', {className: 'cam'}, sum);
    if (!open) return box;
    const type = bind(el('select', {}, ...Object.entries(TYPES).map(([v, t]) => el('option', {value: v, textContent: t}))), cam, 'type');
    type.onchange = () => { cam.type = type.value; renderCams(); };
    const name = bind(el('input'), cam, 'name');
    name.addEventListener('input', () => { title.textContent = cam.name || '(이름 없음)'; });
    const form = el('div', {className: 'form'}, el('div', {className: 'row'}, field('이름', name), field('종류', type)));
    if (cam.type === 'usb') {
      form.append(el('div', {className: 'row'},
        field('카메라 장치', deviceSelect(cam, 'videoDevice', devices && devices.video, '선택하세요')),
        field('마이크 장치', deviceSelect(cam, 'audioDevice', devices && devices.audio, '소리 없음'))));
      form.append(el('div', {className: 'row'},
        field('가로 (0 = 자동)', bind(el('input', {type: 'number', min: 0}), cam, 'width', 'num')),
        field('세로 (0 = 자동)', bind(el('input', {type: 'number', min: 0}), cam, 'height', 'num')),
        field('초당 프레임 (0 = 자동)', bind(el('input', {type: 'number', min: 0}), cam, 'fps', 'num'))));
    } else if (cam.type === 'rtsp') {
      form.append(field('RTSP 주소', bind(el('input', {placeholder: 'rtsp://아이디:비밀번호@192.168.0.10:554/stream1', autocapitalize: 'off', spellcheck: false}), cam, 'url')));
    } else {
      form.append(field('영상 주소', bind(el('input', {placeholder: 'http://192.168.0.20:8080/video', autocapitalize: 'off', spellcheck: false}), cam, 'url')));
      form.append(field('소리 주소 (선택)', bind(el('input', {placeholder: 'http://192.168.0.20:8080/audio.wav', autocapitalize: 'off', spellcheck: false}), cam, 'audioUrl')));
    }
    const checks = el('div', {className: 'row', style: 'margin-top:10px'},
      el('label', {className: 'fit'}, bind(el('input', {type: 'checkbox'}), cam, 'enabled', 'check'), ' 녹화 켜기'),
      el('label', {className: 'fit'}, bind(el('input', {type: 'checkbox'}), cam, 'audio', 'check'), ' 소리 포함'));
    if (cam.type === 'rtsp') checks.append(el('label', {className: 'fit'}, bind(el('input', {type: 'checkbox'}), cam, 'transcode', 'check'), ' H.264로 변환 (폰에서 재생이 안 될 때)'));
    // Deleting takes two presses instead of a browser confirm box, which some
    // browsers silently suppress.
    const del = el('button', {className: 'danger', textContent: '삭제'});
    let armed = 0;
    del.onclick = () => {
      if (!fresh && Date.now() > armed) { armed = Date.now() + 4000; del.textContent = '한 번 더 누르면 삭제'; setTimeout(() => { del.textContent = '삭제'; }, 4000); return; }
      cams.splice(i, 1); openCams.delete(cam); newCams.delete(cam); renderCams(); renderScan();
      toast(fresh ? '추가하던 카메라를 지웠습니다.' : '목록에서 지웠습니다. "저장"을 누르면 녹화가 멈춥니다. 저장된 영상은 남습니다.');
    };
    checks.append(el('span'), del);
    form.append(checks);
    box.append(form);
    return box;
  }));
  if (!cams.length) list.append(el('p', {className: 'dim', textContent: '등록된 카메라가 없습니다. "자동 검색"이나 "+ 직접 추가"로 등록하세요.'}));
  updateCamStatus();
}
function updateCamStatus() {
  if (!status) return;
  const per = status.storage.perCamera || {};
  for (const [id, r] of camRows) {
    const c = camById(id);
    if (!c) continue;
    r.dotWrap.className = c.state;
    r.state.textContent = STATE[c.state] || c.state;
    r.use.textContent = c.enabled ? (per[id] ? '하루 약 ' + gb(per[id]) : '사용량 측정 중') : '';
    r.err.textContent = c.state === 'retrying' ? (c.error || '') : '';
  }
}
function addCam(cam) {
  cams.push(cam); openCams.add(cam); newCams.add(cam); renderCams(); renderScan();
  $('camList').lastElementChild.scrollIntoView({behavior: 'smooth', block: 'center'});
}
$('addCam').onclick = () => addCam({name: '카메라 ' + (cams.length + 1), type: 'rtsp', enabled: true, audio: true});

/* ---------- discovery ---------- */
const KIND = {usb: 'USB', hikvision: 'Hikvision', dahua: 'Dahua', onvif: 'ONVIF', ipwebcam: '폰 앱', droidcam: '폰 앱', rtsp: 'RTSP'};
const STATUS_CLS = {ok: 'recording', routed: 'recording', noport: 'starting', unreachable: 'retrying'};
function isRegistered(d) {
  return cams.some(c => d.kind === 'usb' ? c.type === 'usb' && c.videoDevice === d.draft.videoDevice
    : new RegExp('[/@]' + d.ip.replaceAll('.', '\\.') + '[:/]').test((c.url || '') + '/'));
}
function withLogin(raw, user, pass) {
  if (!user) return raw;
  return raw.replace('://', '://' + encodeURIComponent(user) + (pass ? ':' + encodeURIComponent(pass) : '') + '@');
}
let scanResult = null;
function renderScan() {
  if (!scanResult) return;
  $('scanBox').classList.remove('hide');
  $('scanNets').textContent = scanResult.networks.length
    ? '이 컴퓨터의 네트워크 대역: ' + scanResult.networks.map(n => n.cidr + ' (' + n.name + ', IP ' + n.ip + ')').join(' · ')
    : '이 컴퓨터가 네트워크에 연결되어 있지 않습니다.';
  const list = $('scanList'), fresh = scanResult.devices.filter(d => !isRegistered(d)), known = scanResult.devices.length - fresh.length;
  if (!fresh.length) {
    list.replaceChildren(el('p', {className: 'dim', textContent: known
      ? '새로 찾은 카메라가 없습니다. 찾은 ' + known + '대는 모두 이미 등록되어 있습니다.'
      : '찾은 카메라가 없습니다. 카메라 전원과 랜선, 폰 앱의 서버 시작 여부를 확인하세요.'}));
    return;
  }
  list.replaceChildren(...fresh.map(d => {
    const btn = el('button', {textContent: '등록', className: 'primary'});
    const detail = [KIND[d.kind], d.ip && (d.ip + (d.mask ? ' / ' + d.mask : '')), d.model && d.model !== d.name ? d.model : '', d.mac, '검색: ' + d.foundBy.join(', ')].filter(Boolean).join(' · ');
    const box = el('div', {className: 'found'},
      el('div', {className: 'row'},
        el('div', {className: STATUS_CLS[d.status] || ''}, el('span', {className: 'dot'}), el('b', {textContent: d.name}), el('div', {className: 'dim', textContent: detail})),
        btn),
      el('div', {className: d.status === 'unreachable' ? 'err' : 'dim', textContent: d.message}));
    btn.onclick = () => {
      if (!d.needsLogin) return addCam({...d.draft});
      if (box.querySelector('.login')) return;
      const user = el('input', {placeholder: '카메라 아이디 (예: admin)', autocapitalize: 'off', autocomplete: 'off'});
      const pass = el('input', {placeholder: '카메라 비밀번호', type: 'password', autocomplete: 'off'});
      const go = el('button', {className: 'primary', textContent: '목록에 추가'});
      go.onclick = async () => {
        let url = d.draft.url;
        if (d.xaddr) {
          go.disabled = true; go.textContent = '카메라에 확인 중…';
          try { url = (await api('discover/onvif', 'POST', {xaddr: d.xaddr, username: user.value, password: pass.value})).url; }
          catch (e) { toast(e.message + ' — 기본 주소로 추가했습니다.'); }
        }
        addCam({...d.draft, url: withLogin(url, user.value, pass.value)});
      };
      box.append(el('div', {className: 'row login', style: 'margin-top:8px'}, user, pass, go));
      user.focus();
    };
    return box;
  }));
}
$('scanBtn').onclick = async () => {
  const b = $('scanBtn'); b.disabled = true; b.textContent = '검색 중… (약 5초)';
  try { scanResult = await api('discover'); renderScan(); }
  catch (e) { toast(e.message); }
  b.disabled = false; b.textContent = '다시 검색';
};

$('saveBtn').onclick = async () => {
  syncLimit(true);
  try {
    const c = await api('config', 'PUT', {storageDir: $('sDir').value, limitBy, maxDays: parseFloat($('sDays').value) || 0, maxStorageGB: parseFloat($('sMax').value) || 0, cameras: cams});
    cams = c.cameras || []; openCams.clear(); newCams.clear();
    $('sDays').value = c.maxDays; $('sMax').value = c.maxStorageGB; syncLimit(false);
    renderCams(); renderScan(); toast('저장했습니다. 녹화에 바로 적용됩니다.');
    refreshStatus();
  } catch (e) { toast(e.message); }
};
$('pwBtn').onclick = async () => {
  try { await api('password', 'POST', {current: $('pwCur').value, new: $('pwNew').value}); $('pwCur').value = $('pwNew').value = ''; toast('비밀번호를 변경했습니다.'); }
  catch (e) { toast(e.message); }
};

/* ---------- boot ---------- */
async function start() {
  try { await api('status'); } catch { return; }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  status = null; await refreshStatus();
}
start();
</script>
